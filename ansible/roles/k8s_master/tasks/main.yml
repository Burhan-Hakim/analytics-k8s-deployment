---
- name: Initialize the control plane (Calico default pod CIDR)
  command: kubeadm init --pod-network-cidr=192.168.0.0/16
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube for ubuntu
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy admin.conf to ubuntu
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu

- name: Wait until the API server answers
  become_user: ubuntu
  environment: { KUBECONFIG: /home/ubuntu/.kube/config }
  command: kubectl get --raw=/readyz
  register: apiready
  retries: 30
  delay: 5
  until: apiready.rc == 0
  changed_when: false

- name: Install Calico   # CHECK github.com/projectcalico/calico/releases for anything newer
  become_user: ubuntu
  environment: { KUBECONFIG: /home/ubuntu/.kube/config }
  command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml

- name: Generate the worker join command
  command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false

- name: Save join command on the Ansible controller
  become: false
  delegate_to: localhost
  copy:
    content: "{{ join_cmd.stdout }}"
    dest: /tmp/kubeadm_join_command
    mode: '0600'

- name: Save a copy of admin.conf on the Ansible controller (for the Jenkins credential)
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: /tmp/k8s-admin.conf
    flat: yes
