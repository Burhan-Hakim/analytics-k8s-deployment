<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Analytics Pvt Ltd – Kubernetes Deployment Pipeline</text>

  <rect x="40" y="70" width="170" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="125" y="95" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">Developer</text>
  <text x="125" y="113" text-anchor="middle" font-size="11" fill="#4b5563">git push to master</text>

  <rect x="270" y="70" width="180" height="60" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="360" y="95" text-anchor="middle" font-size="13" fill="#111827" font-weight="600">GitHub</text>
  <text x="360" y="113" text-anchor="middle" font-size="11" fill="#4b5563">analytics-k8s-deployment</text>
  <line x1="210" y1="100" x2="268" y2="100" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="510" y="70" width="180" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="600" y="95" text-anchor="middle" font-size="13" fill="#78350f" font-weight="600">Webhook</text>
  <text x="600" y="113" text-anchor="middle" font-size="11" fill="#92400e">on every push</text>
  <line x1="450" y1="100" x2="508" y2="100" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="360" y="180" width="280" height="120" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="500" y="205" text-anchor="middle" font-size="14" fill="#0c4a6e" font-weight="700">jenkins-master (controller)</text>
  <text x="500" y="222" text-anchor="middle" font-size="10" fill="#0c4a6e">Jenkins + Docker + Terraform + Ansible + kubectl</text>
  <rect x="380" y="235" width="240" height="50" rx="6" fill="#bae6fd" stroke="#0369a1" stroke-width="1.5"/>
  <text x="500" y="255" text-anchor="middle" font-size="12" fill="#0c4a6e" font-weight="600">BUILD job: image build + push</text>
  <text x="500" y="272" text-anchor="middle" font-size="10" fill="#075985">RELEASE job: cron on 25th → kubectl apply</text>
  <line x1="600" y1="130" x2="600" y2="178" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="780" y="70" width="180" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="870" y="95" text-anchor="middle" font-size="13" fill="#312e81" font-weight="600">Docker Hub</text>
  <text x="870" y="113" text-anchor="middle" font-size="11" fill="#4338ca">analytics-website</text>
  <line x1="640" y1="245" x2="870" y2="245" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="870" y1="245" x2="870" y2="132" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
  <text x="878" y="195" font-size="10" fill="#6b7280">push image</text>

  <rect x="330" y="380" width="170" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="415" y="405" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="700">k8s-master</text>
  <text x="415" y="422" text-anchor="middle" font-size="10" fill="#991b1b">containerd + kubeadm</text>
  <text x="415" y="440" text-anchor="middle" font-size="10" fill="#991b1b">control plane + Calico</text>
  <line x1="470" y1="300" x2="415" y2="378" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="445" y="345" font-size="10" fill="#6b7280">kubectl apply (25th)</text>

  <rect x="120" y="380" width="170" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="205" y="405" text-anchor="middle" font-size="13" fill="#14532d" font-weight="700">k8s-worker-1</text>
  <text x="205" y="422" text-anchor="middle" font-size="10" fill="#166534">containerd + kubelet</text>
  <text x="205" y="440" text-anchor="middle" font-size="10" fill="#166534">pod replica 1</text>

  <rect x="540" y="380" width="170" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="625" y="405" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="700">k8s-worker-2</text>
  <text x="625" y="422" text-anchor="middle" font-size="10" fill="#1e40af">containerd + kubelet</text>
  <text x="625" y="440" text-anchor="middle" font-size="10" fill="#1e40af">pod replica 2</text>

  <line x1="330" y1="425" x2="290" y2="425" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="500" y1="425" x2="540" y2="425" stroke="#4b5563" stroke-width="1.5"/>

  <text x="500" y="505" text-anchor="middle" font-size="11" fill="#6b7280">NodePort Service — port 30008 — routes traffic to both worker pods</text>
  <text x="500" y="525" text-anchor="middle" font-size="10" fill="#9ca3af">Terraform provisions the 3 nodes · Ansible installs containerd/Kubernetes and bootstraps the cluster</text>
</svg>
