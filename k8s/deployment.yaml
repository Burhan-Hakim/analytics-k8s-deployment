apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-website
  labels: { app: analytics-website }
spec:
  replicas: 2
  selector:
    matchLabels: { app: analytics-website }
  template:
    metadata:
      labels: { app: analytics-website }
    spec:
      containers:
        - name: analytics-website
          image: YOUR_DOCKERHUB_USERNAME/analytics-website:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
